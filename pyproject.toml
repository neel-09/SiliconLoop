[project]
name = "siliconloop"
version = "0.1.0"
description = "Photo of parts + a sentence -> a working, verified gadget. Built with Muse Spark Open."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "python-dotenv",
    "tavily-python",
    "python-multipart",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siliconloop"]
